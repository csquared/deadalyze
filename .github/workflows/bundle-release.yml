name: Bundle Release

on:
  push:
    tags:
      - "ml-v*"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even when bundle/, algos/ and settings/ have not changed since the previous ml-v tag"
        required: false
        default: false
        type: boolean
      version:
        description: "Bundle version override"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  changes:
    name: check bundle changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME:-$(git rev-parse --short HEAD)}" >> "$GITHUB_OUTPUT"
          fi
      - name: Check changed paths
        id: changed
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current="${GITHUB_REF_NAME:-}"
          base="$(git tag --merged HEAD --list 'ml-v*' --sort=-creatordate | grep -v "^${current}$" | head -1 || true)"
          if [ -z "$base" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$base" "$GITHUB_SHA" -- bundle algos settings engine protocol; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
          - goos: darwin
            goarch: arm64
            runner: macos-15
    env:
      APPLE_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12_BASE64 }}
      APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      ML_VERSION: ${{ needs.changes.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v5
      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_SIGNING_CERTIFICATE_P12_BASE64 != ''
        run: |
          if [ -z "$APPLE_SIGNING_CERTIFICATE_PASSWORD" ]; then
            echo "APPLE_SIGNING_CERTIFICATE_PASSWORD is required when importing the signing certificate." >&2
            exit 2
          fi
          keychain="$RUNNER_TEMP/ml-signing.keychain-db"
          keychain_password="${APPLE_KEYCHAIN_PASSWORD:-$(uuidgen)}"
          certificate="$RUNNER_TEMP/apple-signing.p12"
          printf '%s' "$APPLE_SIGNING_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain"
      - name: Build bundle
        run: ./bundle/build.sh --platform "${{ matrix.goos }}/${{ matrix.goarch }}"
      - name: Inspect bundle
        run: go run ./cmd/bundle inspect "bundle/dist/deadca7-ml-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: deadca7-ml-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bundle/dist/deadca7-ml-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: startsWith(github.ref, 'refs/tags/') && needs.changes.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and manifest
        run: |
          (cd dist && sha256sum deadca7-ml-*.tar.gz > checksums.txt)
          go run ./cmd/bundle manifest -dist dist -version "$GITHUB_REF_NAME" \
            -base "https://github.com/${GITHUB_REPOSITORY}/releases/download" -out dist/manifest.json
          cat dist/manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/deadca7-ml-*.tar.gz
            dist/checksums.txt
            dist/manifest.json

  skipped:
    name: skip unchanged bundle
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.changed != 'true'
    steps:
      - run: echo "bundle/, algos/, settings/, engine/ and protocol/ have not changed since the previous ml-v* tag; skipping."
