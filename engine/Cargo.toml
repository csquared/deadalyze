[workspace]
resolver = "2"
members = ["crates/*", "engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"
base64 = "0.22"
sha2 = "0.10"
