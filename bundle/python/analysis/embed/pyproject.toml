[project]
name = "deadca7-embed"
version = "0.1.0"
description = "CLAP audio and text embeddings for tag suggestions"
requires-python = ">=3.11,<3.12"
dependencies = [
    "laion-clap>=1.1.6",
    "librosa>=0.10",
    "soundfile>=0.12",
    # laion_clap imports torchvision but does not declare it.
    "torchvision>=0.17",
]
